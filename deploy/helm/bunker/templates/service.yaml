apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-control-plane
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  {{- if .Values.service.loadBalancerClass }}
  loadBalancerClass: {{ .Values.service.loadBalancerClass | quote }}
  {{- end }}
  ports:
    - name: https
      port: {{ .Values.service.publicPort }}
      targetPort: https
    - name: mtls
      port: {{ .Values.service.hostPort }}
      targetPort: mtls
  selector: {app.kubernetes.io/name: bunker, app.kubernetes.io/instance: {{ .Release.Name | quote }}}
