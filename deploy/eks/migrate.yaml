apiVersion: batch/v1
kind: Job
metadata: {name: bunker-migrate-0c0d4ea, namespace: bunker}
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      nodeSelector: {kubernetes.io/arch: amd64}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: migrate
          image: 959038055523.dkr.ecr.ap-southeast-2.amazonaws.com/bunker/control-plane:0c0d4ea
          args: [node, control-plane/node_modules/tsx/dist/cli.mjs, control-plane/scripts/migrate.ts]
          env:
            - name: DATABASE_URL
              valueFrom: {secretKeyRef: {name: bunker-database, key: database-url}}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: identity, mountPath: /run/secrets/bunker, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: identity
          secret: {secretName: bunker-identity, defaultMode: 0440}
        - name: tmp
          emptyDir: {sizeLimit: 16Mi}
