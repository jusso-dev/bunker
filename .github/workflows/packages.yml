name: Attested package candidates
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - name: Require a release tag
        # Bootstraps verify provenance against refs/tags/v<version>; refuse other refs.
        shell: bash
        env:
          REF: ${{ github.ref }}
        run: |
          [[ "$REF" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]] || { echo "dispatch packages.yml from a v<version> release tag, not $REF" >&2; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: cargo build --locked --release --package bunker --target ${{ matrix.target }}
      - name: Stage binary, source dependency SBOM and archive
        run: python packaging/scripts/package.py --target ${{ matrix.target }} --output dist
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            dist/bunker-*.tar.gz
            dist/bunker-*.zip
      - name: Locate the per-target SBOM
        id: sbom
        shell: bash
        run: |
          files=(dist/*.cdx.json)
          [ "${#files[@]}" -eq 1 ]
          echo "path=${files[0]}" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-sbom@bd218ad0dbcb3e146bd073d1d9c6d78e08aa8a0b # v2.4.0
        with:
          subject-path: |
            dist/bunker-*.tar.gz
            dist/bunker-*.zip
          sbom-path: ${{ steps.sbom.outputs.path }}
      - uses: sigstore/cosign-installer@d58896d6a1865668819e1d91763c7751a165e159 # v3.9.2
        with:
          cosign-release: v2.5.3
      - name: Keyless signatures for archives and checksums
        shell: bash
        run: |
          for file in dist/*.tar.gz dist/*.zip dist/*.sha256; do
            [ -f "$file" ] || continue
            cosign sign-blob --yes --bundle "$file.sigstore.json" "$file"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bunker-${{ matrix.target }}-attested
          path: dist/*
          if-no-files-found: error
  # Publishing, Apple notarisation, Authenticode/MSI signing and registry
  # submissions are intentionally absent until signing identities are configured.
