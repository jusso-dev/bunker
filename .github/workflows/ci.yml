name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build --workspace --release --locked
      - name: Rust dependency advisory audit
        if: runner.os == 'Linux'
        run: |
          cargo install cargo-audit --locked --version 0.22.2
          cargo audit
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Restore runbook smoke test
        shell: bash
        run: |
          binary=target/release/bunker
          if [ "$RUNNER_OS" = Windows ]; then binary="$binary.exe"; fi
          python packaging/scripts/smoke_restore.py --binary "$binary"
  control-plane:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_DB: bunker_ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['127.0.0.1:5432:5432']
        options: --health-cmd "pg_isready -U postgres -d bunker_ci" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      # Disposable runner-local service; never use trust authentication in deployment.
      BUNKER_TEST_DATABASE_URL: postgres://postgres@localhost:5432/bunker_ci
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - name: Build Rust host for gateway interoperability
        run: cargo build --locked --package bunker
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Notification deployment bootstrap tests
        run: pnpm --filter @bunker/control-plane exec tsx --test tests/notification-deployment.test.ts
      - name: PostgreSQL API integration tests
        run: pnpm --filter @bunker/control-plane exec tsx --test tests/api.test.ts
      - name: Notification migration and PostgreSQL delivery integration tests
        run: |
          pnpm --filter @bunker/control-plane exec tsx scripts/migrate.ts
          pnpm --filter @bunker/control-plane exec tsx --test tests/notifications.integration.test.ts
        env:
          DATABASE_URL: ${{ env.BUNKER_TEST_DATABASE_URL }}
      - run: pnpm build
      - name: Production identity and built gateway integration tests
        run: pnpm --filter @bunker/control-plane exec tsx --test --test-concurrency=1 tests/identity.test.ts tests/next-gateway.test.ts
        env:
          BUNKER_TEST_REAL_NEXT: 'true'
          BUNKER_TEST_BINARY: ${{ github.workspace }}/target/debug/bunker
  docs-and-packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: python -m pip install --requirement packaging/docs-requirements.txt
      - run: python packaging/scripts/validate.py
      - run: python packaging/scripts/test_packaging.py
      - run: node --test .github/actions/snapshot/action.test.cjs
      - run: shellcheck packaging/scripts/*.sh deploy/*.sh
      - run: mkdocs build --strict --config-file docs/user/mkdocs.yml --site-dir "$RUNNER_TEMP/bunker-docs"
      - uses: azure/setup-helm@b9e51907a09c216f16ebe8536097933489208112 # v4.3.0
        with:
          version: v3.17.3
      - run: helm lint deploy/helm/bunker && helm template bunker deploy/helm/bunker > "$RUNNER_TEMP/bunker-chart.yaml"
      - name: Validate Compose without contacting a Docker daemon
        run: docker --context default compose --file deploy/compose.yml config --quiet
        env:
          BUNKER_ORIGIN: https://console.example.test:8443
          BUNKER_HOST_ORIGIN: https://hosts.example.test:8444
          BUNKER_IDENTITY_SECRETS: /tmp/bunker-compose-validation/identity
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: documentation
          path: ${{ runner.temp }}/bunker-docs
