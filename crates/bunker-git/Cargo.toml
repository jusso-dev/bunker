[package]
name = "bunker-git"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.91"
description = "Offline, caller-encrypted Git capture and journaled recovery"


[dependencies]
anyhow = "1"
bunker-discovery = { path = "../bunker-discovery" }
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
tempfile = "3"
