[package]
name = "bunker-keys"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
license = "Apache-2.0"

[dependencies]
anyhow = "1"
async-trait = "0.1"
aws-lc-rs = "1.19"
aws-sdk-kms = { version = "=1.83.0", default-features = false, features = ["default-https-client", "rt-tokio", "behavior-version-latest"] }
base64 = "0.22"
blake3 = "1"
chacha20poly1305 = "0.11"
crc32c = "0.6"
rand = "0.8"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = "1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
