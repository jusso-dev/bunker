[package]
name = "bunker"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
anyhow = "1"
argon2 = "0.5"
base64 = "0.22"
blake3 = "1"
cap-std = "3"
cap-fs-ext = "3"
chacha20poly1305 = "0.11"
clap = { version = "4", features = ["derive"] }
ctrlc = { version = "3.5", features = ["termination"] }
fastcdc = "3"
fs2 = "0.4"
futures-util = "0.3"
globset = "0.4"
hex = "0.4"
http = "1"
hmac = "0.12"
sha2 = "0.10"
url = "2"
httpdate = "1"
reqsign-core = { version = "=3.3.2", default-features = false }
reqsign-aws-v4 = { version = "=3.3.1", default-features = false }
reqsign-azure-storage = { version = "=3.3.0", default-features = false }
libc = "0.2"
opendal = { version = "0.59.5", features = ["services-s3", "services-azblob", "services-gdrive", "services-onedrive", "services-fs", "services-memory"] }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls-native-roots"] }
openssl = { version = "0.10", features = ["vendored"] }
uuid = { version = "1", features = ["v4", "v5", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
toml = "0.8"
tokio = { version = "1", features = ["rt-multi-thread"] }
walkdir = "2"
zeroize = { version = "1", features = ["derive"] }
bunker-discovery = { path = "../bunker-discovery" }
bunker-keys = { path = "../bunker-keys" }
bunker-git = { path = "../bunker-git" }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
