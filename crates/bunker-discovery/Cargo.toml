[package]
name = "bunker-discovery"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Fixture-driven agent setup discovery and snapshot safety policy"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
globset = "0.4"
regex = "1"
cap-std = "3"
cap-fs-ext = "3"
unicode-normalization = "0.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
