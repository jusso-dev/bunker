    "/me": {
      "get": {
        "operationId": "get_me",
        "summary": "List only tenants the signed-in human can access",
        "parameters": [
          {
            "name": "before",
            "in": "query",
            "required": false,
            "description": "Legacy exclusive timestamp filter. Prefer cursor for lossless equal-timestamp boundaries; cannot be combined with cursor.",
            "schema": {
              "type": "string",
              "format": "date-time"
            }
          },
          {
            "name": "cursor",
            "in": "query",
            "required": false,
            "description": "Opaque X-Next-Cursor from the previous page of the same collection, tenant and actor. Stable descending timestamp + ID keyset; preserves PostgreSQL microseconds. Do not construct or edit.",
            "schema": {
              "type": "string",
              "maxLength": 2048
            }
          },
          {
            "name": "limit",
            "in": "query",
            "required": false,
            "schema": {
              "type": "integer",
              "minimum": 1,
              "maximum": 200,
              "default": 200
            }
          }
        ],
        "security": [
          {
            "humanSession": []
          }
        ],
        "responses": {
          "200": {
            "description": "Successful response",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/meResponse"
                }
              }
            },
            "headers": {
              "X-Next-Cursor": {
                "description": "Present only when more rows exist. Supply as cursor on the next request. Response bodies remain arrays (or the existing /me object).",
                "schema": {
                  "type": "string"
                }
