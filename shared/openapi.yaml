  "openapi": "3.1.0",
  "info": {
    "title": "Bunker metadata control plane",
    "version": "0.1.0",
    "description": "No content or key ingestion endpoints. Human sessions and host credentials are separate. Production hosts require certificates on the strict mTLS gateway listener. The separate public HTTPS listener serves enrollment and humans. Development bearer transport requires explicit trusted-loopback mode. Human mutation requests, including login, require Origin matching BUNKER_ORIGIN. Poll policies and restores every 30 seconds."
  },
