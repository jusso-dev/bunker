    "/tenants/{tenantId}/evidence": {
      "get": {
        "operationId": "get_tenants_tenantId_evidence",
        "summary": "List evidence; bounded timestamp + ID pagination",
        "parameters": [
          {
            "name": "tenantId",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "format": "uuid"
            }
          },
          {
            "name": "before",
            "in": "query",
            "required": false,
            "description": "Legacy exclusive timestamp filter. Prefer cursor for lossless equal-timestamp boundaries; cannot be combined with cursor.",
            "schema": {
              "type": "string",
              "format": "date-time"
            }
          },
          {
            "name": "cursor",
            "in": "query",
            "required": false,
            "description": "Opaque X-Next-Cursor from the previous page of the same collection, tenant and actor. Stable descending timestamp + ID keyset; preserves PostgreSQL microseconds. Do not construct or edit.",
            "schema": {
              "type": "string",
              "maxLength": 2048
            }
          },
          {
            "name": "limit",
            "in": "query",
            "required": false,
            "schema": {
              "type": "integer",
              "minimum": 1,
              "maximum": 200,
              "default": 200
