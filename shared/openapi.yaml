    "/auth/sessions": {
      "get": {
        "operationId": "get_auth_sessions",
        "summary": "List own active sessions using non-credential management handles; never returns authentication tokens or hashes",
        "parameters": [
          {
            "name": "before",
            "in": "query",
            "required": false,
            "description": "Legacy exclusive timestamp filter. Prefer cursor for lossless equal-timestamp boundaries; cannot be combined with cursor.",
            "schema": {
              "type": "string",
              "format": "date-time"
            }
          },
          {
            "name": "cursor",
            "in": "query",
